<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Thẻ đeo 3D</title>
<style>
  :root{
    --bg:#0b0b0d;
    --bg2:#16161a;
    --text:#f5f5f5;
    --muted:#9a9aa2;
    --accent:#e5e5e5;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#eceff3;
      --bg2:#dde1e7;
      --text:#15161a;
      --muted:#5b5d66;
      --accent:#15161a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0b0b0d;
    --bg2:#16161a;
    --text:#f5f5f5;
    --muted:#9a9aa2;
    --accent:#e5e5e5;
  }
  *{box-sizing:border-box;}
 html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent !important;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color: var(--text);
}
  #stage{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
  }
  canvas{ display:block; touch-action:none; }
  #hint{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    font-size:12px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    pointer-events:none;
    opacity:.85;
    text-align:center;
    width:100%;
    padding:0 16px;
  }
</style>

    var stage = document.getElementById('stage');

      var y = ANCHOR.y - i * SEG_LEN;

    var buckleGroup = new THREE.Group();
    scene.add(buckleGroup);
    var buckleBody = new THREE.Mesh(new THREE.BoxGeometry(RIBBON_WIDTH * 1.35, 0.34, 0.09), plasticMat);
    buckleGroup.add(buckleBody);
    var buckleSeam = new THREE.Mesh(new THREE.BoxGeometry(RIBBON_WIDTH * 1.35 + 0.01, 0.02, 0.095), new THREE.MeshStandardMaterial({ color: 0x2a2a2a, roughness:0.5 }));
    buckleGroup.add(buckleSeam);

    // ---------- card ----------
    var CARD_W = 1.72, CARD_H = 2.293;
    var loader = new THREE.TextureLoader();
    var photoTex = loader.load(PHOTO_DATA_URL);
    photoTex.encoding = THREE.sRGBEncoding !== undefined ? THREE.sRGBEncoding : photoTex.encoding;
    photoTex.anisotropy = 8;

    var cardPivot = new THREE.Group();
    scene.add(cardPivot);

    // metal swivel hook connecting the ribbon end to the card's grommet hole
    var hookGroup = new THREE.Group();
    cardPivot.add(hookGroup);

    var dRing = new THREE.Mesh(new THREE.TorusGeometry(0.085, 0.017, 8, 20), metalMat);
    dRing.rotation.x = Math.PI / 2;
    dRing.position.set(0, -0.02, 0);
    hookGroup.add(dRing);

    var swivelBar = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.13, 10), metalMat);
    swivelBar.position.set(0, -0.1, 0);
    hookGroup.add(swivelBar);

    var swivelCap = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, 0.05, 12), metalMat);
    swivelCap.position.set(0, -0.155, 0);
    hookGroup.add(swivelCap);

    var hookRing = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.02, 8, 20, Math.PI * 1.7), metalMat);
    hookRing.rotation.z = Math.PI * 0.62;
    hookRing.position.set(0, -0.3, 0);
    hookGroup.add(hookRing);

    var hookGate = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.11, 8), metalMat);
    hookGate.rotation.z = Math.PI / 2 + 0.35;
    hookGate.position.set(0.035, -0.34, 0);
    hookGroup.add(hookGate);

    var cardGroup = new THREE.Group();
    cardGroup.position.set(0, -0.22 - CARD_H/2, 0);
    cardPivot.add(cardGroup);

    var frontMat = new THREE.MeshBasicMaterial({ map: photoTex, toneMapped: false });

    var backCanvas = document.createElement('canvas');
    backCanvas.width = 750;
    backCanvas.height = Math.round(750 * (CARD_H / CARD_W));
    (function paintBack(){
      var ctx = backCanvas.getContext('2d');
      var w = backCanvas.width, h = backCanvas.height;
      ctx.fillStyle = '#0c0c0e';
      ctx.fillRect(0,0,w,h);
      ctx.fillStyle = '#f2f1ec';
      ctx.textBaseline = 'alphabetic';
      ctx.font = '800 84px -apple-system, "Helvetica Neue", Arial, sans-serif';
      ctx.fillText('STAFF', 64, 170);
      ctx.font = '500 42px -apple-system, "Helvetica Neue", Arial, sans-serif';
      ctx.fillStyle = '#c9c9c9';
      ctx.fillText('Minh Nhật', 66, 232);
    })();
    var backTex = new THREE.CanvasTexture(backCanvas);
    if (THREE.sRGBEncoding !== undefined) backTex.encoding = THREE.sRGBEncoding;
    var backMat = new THREE.MeshBasicMaterial({ map: backTex, toneMapped: false });
    var edgeMat = new THREE.MeshStandardMaterial({ color: 0xf3f3f3, roughness:0.5, metalness:0.1 });

    var cardGeo = new THREE.BoxGeometry(CARD_W, CARD_H, 0.045);
    var cardMaterials = [edgeMat, edgeMat, edgeMat, edgeMat, frontMat, backMat];
    var cardMesh = new THREE.Mesh(cardGeo, cardMaterials);
    cardGroup.add(cardMesh);

    // hole for the clip (purely visual, small dark circle near top)
    var holeGeo = new THREE.CircleGeometry(0.045, 16);
    var holeMat = new THREE.MeshBasicMaterial({ color: 0x0a0a0a });
    var hole = new THREE.Mesh(holeGeo, holeMat);
    hole.position.set(0, CARD_H/2 - 0.16, 0.024);
    cardGroup.add(hole);

    // ---------- drag state ----------
    var raycaster = new THREE.Raycaster();
    var pointerNDC = new THREE.Vector2();
    var dragPlane = new THREE.Plane(new THREE.Vector3(0,0,1), 0);
    var dragging = false;
    var grabOffset = new THREE.Vector3();
    var yaw = 0, yawVel = 0;
    var lastPointerX = 0, pointerVelX = 0;

    function setPointerFromEvent(e){
      var cx = (e.touches && e.touches[0]) ? e.touches[0].clientX : e.clientX;
      var cy = (e.touches && e.touches[0]) ? e.touches[0].clientY : e.clientY;
      pointerNDC.x = (cx / window.innerWidth) * 2 - 1;
      pointerNDC.y = -(cy / window.innerHeight) * 2 + 1;
      return cx;
    }

    function getPlanePoint(target){
      raycaster.setFromCamera(pointerNDC, camera);
      raycaster.ray.intersectPlane(dragPlane, target);
      return target;
    }

    function onDown(e){
      var cx = setPointerFromEvent(e);
      raycaster.setFromCamera(pointerNDC, camera);
      var hits = raycaster.intersectObject(cardMesh, false);
      if (hits.length){
        dragging = true;
        document.body.style.cursor = 'grabbing';
        var hitPoint = new THREE.Vector3();
        getPlanePoint(hitPoint);
        grabOffset.copy(hitPoint).sub(points[lastIdx].pos);
        lastPointerX = cx;
        e.preventDefault();
      }
    }
    function onMove(e){
      var cx = setPointerFromEvent(e);
      if (!dragging) return;
      pointerVelX = cx - lastPointerX;
      lastPointerX = cx;
      e.preventDefault();
    }
    function onUp(){
      dragging = false;
      document.body.style.cursor = 'auto';
    }

    renderer.domElement.addEventListener('mousedown', onDown);
    renderer.domElement.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
    renderer.domElement.addEventListener('touchstart', onDown, {passive:false});
    renderer.domElement.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('touchend', onUp);

    // ---------- physics step ----------
    var tmpTarget = new THREE.Vector3();
    function integrate(dt){
      for (var i = 0; i < points.length; i++){
        var p = points[i];
        if (p.pinned) continue;
        if (i === lastIdx && dragging) continue;
        var vx = (p.pos.x - p.old.x) * DAMPING;
        var vy = (p.pos.y - p.old.y) * DAMPING;
        var vz = (p.pos.z - p.old.z) * DAMPING;
        var nx = p.pos.x + vx;
        var ny = p.pos.y + vy + GRAVITY.y * dt * dt;
        var nz = p.pos.z + vz;
        p.old.copy(p.pos);
        p.pos.set(nx, ny, nz);
      }

      if (dragging){
        getPlanePoint(tmpTarget);
        tmpTarget.sub(grabOffset);
        var last = points[lastIdx];
        last.old.copy(last.pos);
        last.pos.copy(tmpTarget);
      }
    }

    function solveConstraints(){
      for (var iter = 0; iter < CONSTRAINT_ITER; iter++){
        for (var i = 0; i < points.length - 1; i++){
          var a = points[i], b = points[i+1];
          var dx = b.pos.x - a.pos.x;
          var dy = b.pos.y - a.pos.y;
          var dz = b.pos.z - a.pos.z;
          var dist = Math.sqrt(dx*dx+dy*dy+dz*dz) || 0.0001;
          var diff = (dist - SEG_LEN) / dist;
          var ox = dx * 0.5 * diff, oy = dy * 0.5 * diff, oz = dz * 0.5 * diff;
          var aLocked = a.pinned;
          var bLocked = (i+1 === lastIdx) && dragging;
          if (!aLocked){ a.pos.x += ox; a.pos.y += oy; a.pos.z += oz; }
          if (!bLocked){ b.pos.x -= ox; b.pos.y -= oy; b.pos.z -= oz; }
        }
        points[0].pos.copy(ANCHOR);
      }
    }

    function updateVisuals(dt){
      for (var i = 0; i < points.length; i++) curvePts[i].copy(points[i].pos);
      curve.points = curvePts;
      ribbonMesh.geometry.dispose();
      ribbonMesh.geometry = buildRibbonGeometry(curve, 48, RIBBON_WIDTH);

      var last = points[lastIdx];
      var prev = points[lastIdx - 1];
      cardPivot.position.copy(last.pos);

      var dx = last.pos.x - prev.pos.x;
      var dy = last.pos.y - prev.pos.y;
      var roll = Math.atan2(dx, -dy);
      var maxRoll = 0.9;
      roll = Math.max(-maxRoll, Math.min(maxRoll, roll));
      cardPivot.rotation.z = roll;

      if (dragging){
        yawVel += pointerVelX * 0.02;
      }
      yawVel += (-yaw) * 6 * dt - yawVel * 3.2 * dt;
      yaw += yawVel * dt;
      cardPivot.rotation.y = yaw;

      pointerVelX *= 0.8;

      var bp = points[BUCKLE_INDEX].pos;
      var bpPrev = points[BUCKLE_INDEX - 1].pos;
      buckleGroup.position.copy(bp);
      var bdx = bp.x - bpPrev.x, bdy = bp.y - bpPrev.y;
      buckleGroup.rotation.z = Math.atan2(bdx, -bdy);
    }

    // ---------- loop ----------
    var clock = new THREE.Clock();
    var accumulator = 0;
    var FIXED_DT = 1/60;

    function animate(){
      requestAnimationFrame(animate);
      var delta = Math.min(clock.getDelta(), 0.05);
      accumulator += delta;
      while (accumulator > FIXED_DT){
        integrate(FIXED_DT);
        solveConstraints();
        accumulator -= FIXED_DT;
      }
      updateVisuals(delta);
      renderer.render(scene, camera);
    }
    animate();

    function onResize(){
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener('resize', onResize);
  })();
  </script>
</body>
</html>
