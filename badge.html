<title>Thẻ Backstage — 3D Badge</title>

<style>
  :root{
    --bg-top:#0d1017;
    --bg-bottom:#040508;
    --ink:#e9ebef;
    --ink-dim:#9aa0ac;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background: radial-gradient(120% 90% at 50% 8%, #161a24 0%, var(--bg-top) 32%, var(--bg-bottom) 100%);
    overflow:hidden;
    font-family:"Space Grotesk", Arial, sans-serif;
    color:var(--ink);
  }
  #c{
    position:fixed; inset:0; width:100%; height:100%; display:block;
    cursor:grab; touch-action:none;
  }
  #loading{
    position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; z-index:10; transition:opacity .5s ease;
    background: radial-gradient(120% 90% at 50% 8%, #161a24 0%, var(--bg-top) 32%, var(--bg-bottom) 100%);
  }
  #loading.hidden{ opacity:0; pointer-events:none; }
  .spinner{
    width:34px; height:34px; border-radius:50%;
    border:2.5px solid rgba(233,235,239,0.15);
    border-top-color: rgba(233,235,239,0.85);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  #loading span{ font-size:13px; letter-spacing:0.08em; color:var(--ink-dim); }
  #hint{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(8px);
    font-size:12.5px; letter-spacing:0.06em; color:var(--ink-dim);
    opacity:0; transition:opacity .6s ease, transform .6s ease;
    pointer-events:none; z-index:5; text-align:center; white-space:nowrap;
  }
  #hint.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

(function () {
  'use strict';

  // Renderer / Scene / Camera

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
  renderer.shadowMap.enabled = false;

  var scene = new THREE.Scene();

  var camera = new THREE.PerspectiveCamera(25, 1, 0.1, 100);
  camera.position.set(0, 0.4, 13);

  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);

  // ---------------------------------------------------------------------
  // Lighting + baked environment (procedural "lightformer" studio)
  // ---------------------------------------------------------------------
  var ambient = new THREE.AmbientLight(0xffffff, 0.55);
  scene.add(ambient);

  var key = new THREE.DirectionalLight(0xffffff, 1.1);
  key.position.set(3, 5, 6);
  scene.add(key);

  var fill = new THREE.DirectionalLight(0x9fb4ff, 0.35);
  fill.position.set(-4, 1, 3);
  scene.add(fill);

  var rim = new THREE.DirectionalLight(0xffe9c9, 0.6);
  rim.position.set(-2, -3, -4);
  scene.add(rim);

  var pmrem = new THREE.PMREMGenerator(renderer);
  pmrem.compileEquirectangularShader();

  function buildEnvironment() {
    var envScene = new THREE.Scene();
    envScene.background = new THREE.Color(0x03040a);

    function bar(w, h, intensity, color, x, y, z, rz) {
      var geo = new THREE.PlaneGeometry(w, h);
      var mat = new THREE.MeshBasicMaterial({ color: color });
      var m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.rotation.z = rz || 0;
      m.material.color.multiplyScalar(intensity);
      envScene.add(m);
      return m;
    }

    bar(30, 0.6, 2.0, 0xffffff, 0, -3, 6, Math.PI / 6);
    bar(30, 0.6, 2.6, 0xffffff, -2, -2, 3, Math.PI / 5);
    bar(30, 0.6, 3.2, 0xffffff, 3, 3, 2, -Math.PI / 6);
    bar(30, 3, 6.0, 0xffffff, -9, 0, 10, Math.PI / 2.3);
    bar(20, 1.2, 1.6, 0xbcd0ff, 6, 5, -4, Math.PI / 4);
    bar(20, 1.2, 1.2, 0xffd9b0, -6, -5, -4, -Math.PI / 4);

    var envRT = pmrem.fromScene(envScene, 0.06);
    scene.environment = envRT.texture;
    envScene.traverse(function (o) { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
  }
  buildEnvironment();

  // ---------------------------------------------------------------------
  // Card texture (front face) — drawn on an offscreen canvas
  // ---------------------------------------------------------------------
  var CARD_W_PX = 1000, CARD_H_PX = 1500;

  function drawOrganicRing(ctx, cx, cy, r) {
    ctx.save();
    ctx.strokeStyle = 'rgba(240,233,220,0.82)';
    ctx.lineWidth = 5.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    var pts = [];
    var wobble = [1.04, 0.97, 1.06, 0.95, 1.02, 0.98, 1.05, 0.93, 1.0, 1.03, 0.96, 1.01];
    var startAngle = -Math.PI * 0.38;
    var endAngle = startAngle + Math.PI * 1.82; // leave a gap so it's not fully closed
    var N = wobble.length;
    for (var i = 0; i <= N; i++) {
      var t = i / N;
      var a = startAngle + (endAngle - startAngle) * t;
      var rr = r * wobble[i % N];
      pts.push([cx + Math.cos(a) * rr, cy + Math.sin(a) * rr * 1.08]);
    }
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (var j = 1; j < pts.length - 2; j++) {
      var xc = (pts[j][0] + pts[j + 1][0]) / 2;
      var yc = (pts[j][1] + pts[j + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[j][0], pts[j][1], xc, yc);
    }
    ctx.stroke();
    ctx.restore();
  }

  function makeCardTexture(photoImg) {
    var cv = document.createElement('canvas');
    cv.width = CARD_W_PX; cv.height = CARD_H_PX;
    var ctx = cv.getContext('2d');

    // Photo, full bleed
    ctx.drawImage(photoImg, 0, 0, CARD_W_PX, CARD_H_PX);

    // Dark navy wash to unify with badge palette
    var g = ctx.createLinearGradient(0, 0, 0, CARD_H_PX);
    g.addColorStop(0.0, 'rgba(9,11,16,0.90)');
    g.addColorStop(0.22, 'rgba(11,14,20,0.42)');
    g.addColorStop(0.52, 'rgba(13,16,22,0.40)');
    g.addColorStop(0.72, 'rgba(11,14,20,0.62)');
    g.addColorStop(1.0, 'rgba(8,10,15,0.95)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, CARD_W_PX, CARD_H_PX);

    // subtle overall navy tint multiply for cohesion
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = 'rgba(120,140,190,0.14)';
    ctx.fillRect(0, 0, CARD_W_PX, CARD_H_PX);
    ctx.restore();

    // vignette
    var vg = ctx.createRadialGradient(CARD_W_PX / 2, CARD_H_PX * 0.55, CARD_H_PX * 0.25, CARD_W_PX / 2, CARD_H_PX * 0.55, CARD_H_PX * 0.75);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.45)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, CARD_W_PX, CARD_H_PX);

    // faint hole indicator ring (matches the physical grommet hole in geometry)
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(CARD_W_PX / 2, 148, 46, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();

    // organic circle line art
    drawOrganicRing(ctx, CARD_W_PX / 2, CARD_H_PX * 0.635, 250);

    // STAFF text
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = '#F7F5F1';
    ctx.font = '900 208px "Archivo Black", "Arial Black", sans-serif';
    try { ctx.letterSpacing = '-4px'; } catch (e) {}
    ctx.shadowColor = 'rgba(0,0,0,0.55)';
    ctx.shadowBlur = 22;
    ctx.fillText('STAFF', CARD_W_PX / 2, CARD_H_PX * 0.665);
    ctx.restore();

    // subtitle
    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(242,242,240,0.92)';
    ctx.font = '600 40px "Space Grotesk", Arial, sans-serif';
    try { ctx.letterSpacing = '7px'; } catch (e) {}
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 14;
    ctx.fillText('BACK STAGE ACCESS', CARD_W_PX / 2 + 4, CARD_H_PX * 0.735);
    ctx.restore();

    // top-right small labels
    ctx.save();
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.font = '600 34px "Space Grotesk", Arial, sans-serif';
    try { ctx.letterSpacing = '1px'; } catch (e) {}
    ctx.fillText('mnhat', CARD_W_PX - 54, 84);
    ctx.fillStyle = 'rgba(220,222,230,0.75)';
    ctx.font = '400 28px "Space Grotesk", Arial, sans-serif';
    ctx.fillText('01.24.25', CARD_W_PX - 54, 122);
    ctx.restore();

    var tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
    tex.needsUpdate = true;
    return tex;
  }

  // ---------------------------------------------------------------------
  // Card geometry: rounded rect with a hole near the top, 2:3 ratio
  // ---------------------------------------------------------------------
  var CARD_HW = 0.75, CARD_HH = 1.125; // half width/height -> 1.5 x 2.25 (2:3)
  var CARD_R = 0.09;
  var CARD_T = 0.032; // thickness
  var HOLE_R = 0.052;
  var HOLE_Y = CARD_HH - 0.163;

  function roundedRectShape(hw, hh, r) {
    var s = new THREE.Shape();
    s.moveTo(-hw + r, -hh);
    s.lineTo(hw - r, -hh);
    s.quadraticCurveTo(hw, -hh, hw, -hh + r);
    s.lineTo(hw, hh - r);
    s.quadraticCurveTo(hw, hh, hw - r, hh);
    s.lineTo(-hw + r, hh);
    s.quadraticCurveTo(-hw, hh, -hw, hh - r);
    s.lineTo(-hw, -hh + r);
    s.quadraticCurveTo(-hw, -hh, -hw + r, -hh);
    return s;
  }

  function buildCardMesh(frontTex) {
    var shape = roundedRectShape(CARD_HW, CARD_HH, CARD_R);
    var holePath = new THREE.Path();
    holePath.absarc(0, HOLE_Y, HOLE_R, 0, Math.PI * 2, false);
    shape.holes.push(holePath);

    var group = new THREE.Group();

    // side wall
    var sideGeo = new THREE.ExtrudeGeometry(shape, { depth: CARD_T, bevelEnabled: true, bevelThickness: 0.006, bevelSize: 0.006, bevelSegments: 2, curveSegments: 24 });
    sideGeo.translate(0, 0, -CARD_T / 2);
    var sideMat = new THREE.MeshPhysicalMaterial({ color: 0x14181f, roughness: 0.55, metalness: 0.08, clearcoat: 0.3, clearcoatRoughness: 0.4, envMapIntensity: 0.8 });
    var sideMesh = new THREE.Mesh(sideGeo, sideMat);
    group.add(sideMesh);

    // front cap
    var frontGeo = new THREE.ShapeGeometry(shape, 24);
    var frontMat = new THREE.MeshPhysicalMaterial({ map: frontTex, roughness: 0.38, metalness: 0.04, clearcoat: 0.85, clearcoatRoughness: 0.22, envMapIntensity: 1.15 });
    var frontMesh = new THREE.Mesh(frontGeo, frontMat);
    frontMesh.position.z = CARD_T / 2 + 0.001;
    group.add(frontMesh);

    // back cap
    var backGeo = new THREE.ShapeGeometry(shape, 24);
    var backMat = new THREE.MeshPhysicalMaterial({ color: 0x11151b, roughness: 0.5, metalness: 0.05, clearcoat: 0.6, clearcoatRoughness: 0.3, envMapIntensity: 0.9 });
    var backMesh = new THREE.Mesh(backGeo, backMat);
    backMesh.rotation.y = Math.PI;
    backMesh.position.z = -CARD_T / 2 - 0.001;
    group.add(backMesh);

    return group;
  }

  // ---------------------------------------------------------------------
  // Metal hardware: grommet ring, D-rings, carabiner clips
  // ---------------------------------------------------------------------
  var metalMat = new THREE.MeshStandardMaterial({ color: 0xd7dbe1, roughness: 0.28, metalness: 1.0, envMapIntensity: 1.4 });
  var metalMatDark = new THREE.MeshStandardMaterial({ color: 0x9aa0a8, roughness: 0.35, metalness: 1.0, envMapIntensity: 1.3 });

  function buildGrommet() {
    var geo = new THREE.TorusGeometry(HOLE_R * 1.08, 0.014, 12, 28);
    var m = new THREE.Mesh(geo, metalMat);
    m.position.set(0, HOLE_Y, 0);
    return m;
  }

  function buildDRing() {
    var g = new THREE.Group();
    var geo = new THREE.TorusGeometry(0.05, 0.011, 10, 20);
    var m = new THREE.Mesh(geo, metalMat);
    m.scale.set(1, 1.35, 1);
    g.add(m);
    return g;
  }

  function buildCarabiner() {
    var g = new THREE.Group();
    var bodyGeo = new THREE.TorusGeometry(0.085, 0.016, 10, 26, Math.PI * 1.55);
    var body = new THREE.Mesh(bodyGeo, metalMat);
    body.rotation.z = Math.PI * 0.62;
    g.add(body);

    var gateGeo = new THREE.BoxGeometry(0.02, 0.13, 0.02);
    var gate = new THREE.Mesh(gateGeo, metalMatDark);
    gate.position.set(0.075, -0.02, 0);
    gate.rotation.z = -0.25;
    g.add(gate);

    var pinGeo = new THREE.SphereGeometry(0.016, 10, 10);
    var pin = new THREE.Mesh(pinGeo, metalMatDark);
    pin.position.set(0.11, -0.085, 0);
    g.add(pin);

    return g;
  }

  function buildBuckle(color) {
    var g = new THREE.Group();
    var bodyGeo = new THREE.BoxGeometry(0.17, 0.09, 0.02);
    var mat = new THREE.MeshPhysicalMaterial({ color: 0x1c1d20, roughness: 0.5, metalness: 0.1, clearcoat: 0.4 });
    var body = new THREE.Mesh(bodyGeo, mat);
    g.add(body);
    var barGeo = new THREE.CylinderGeometry(0.012, 0.012, 0.2, 10);
    var bar = new THREE.Mesh(barGeo, metalMatDark);
    bar.rotation.z = Math.PI / 2;
    g.add(bar);
    return g;
  }

  // ---------------------------------------------------------------------
  // Ribbon (flat strap) geometry helper
  // ---------------------------------------------------------------------
  function makeRibbonGeometry(segments) {
    var geo = new THREE.BufferGeometry();
    var posArr = new Float32Array((segments + 1) * 2 * 3);
    var uvArr = new Float32Array((segments + 1) * 2 * 2);
    var indices = [];
    for (var i = 0; i < segments; i++) {
      var a = i * 2, b = i * 2 + 1, c = i * 2 + 2, d = i * 2 + 3;
      indices.push(a, b, c, b, d, c);
    }
    for (var i2 = 0; i2 <= segments; i2++) {
      var v = i2 / segments;
      uvArr[i2 * 4 + 0] = 0; uvArr[i2 * 4 + 1] = v;
      uvArr[i2 * 4 + 2] = 1; uvArr[i2 * 4 + 3] = v;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3).setUsage(THREE.DynamicDrawUsage));
    geo.setAttribute('uv', new THREE.BufferAttribute(uvArr, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    return geo;
  }

  function updateRibbon(geo, curvePoints, width, camera) {
    var posAttr = geo.getAttribute('position');
    var arr = posAttr.array;
    var viewDir = new THREE.Vector3();
    var tangent = new THREE.Vector3();
    var side = new THREE.Vector3();
    var tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();
    for (var i = 0; i < curvePoints.length; i++) {
      var p = curvePoints[i];
      var pPrev = curvePoints[Math.max(0, i - 1)];
      var pNext = curvePoints[Math.min(curvePoints.length - 1, i + 1)];
      tangent.subVectors(pNext, pPrev);
      if (tangent.lengthSq() < 1e-8) tangent.set(0, 1, 0);
      tangent.normalize();
      viewDir.subVectors(camera.position, p).normalize();
      side.crossVectors(tangent, viewDir);
      if (side.lengthSq() < 1e-8) side.set(1, 0, 0);
      side.normalize().multiplyScalar(width / 2);
      tmpA.copy(p).add(side);
      tmpB.copy(p).sub(side);
      var idx = i * 6;
      arr[idx] = tmpA.x; arr[idx + 1] = tmpA.y; arr[idx + 2] = tmpA.z;
      arr[idx + 3] = tmpB.x; arr[idx + 4] = tmpB.y; arr[idx + 5] = tmpB.z;
    }
    posAttr.needsUpdate = true;
    geo.computeVertexNormals();
    geo.computeBoundingSphere();
  }

  function strapTexture(baseColor, ticks, holes) {
    var w = 64, h = 512;
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.fillStyle = baseColor;
    ctx.fillRect(0, 0, w, h);
    // subtle weave shading
    var g = ctx.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.12)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.06)');
    g.addColorStop(1, 'rgba(0,0,0,0.14)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    if (ticks) {
      ctx.strokeStyle = 'rgba(255,255,255,0.55)';
      ctx.lineWidth = 2;
      for (var y = 18; y < h * 0.4; y += 26) {
        ctx.beginPath();
        ctx.moveTo(w * 0.22, y);
        ctx.lineTo(w * 0.78, y);
        ctx.stroke();
      }
    }
    if (holes) {
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      for (var y2 = 20; y2 < h * 0.34; y2 += 22) {
        ctx.beginPath();
        ctx.arc(w / 2, y2, 3.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }
    var tex = new THREE.CanvasTexture(cv);
    tex.encoding = THREE.sRGBEncoding;
    tex.wrapS = THREE.RepeatWrapping;
    tex.wrapT = THREE.RepeatWrapping;
    return tex;
  }

  // ---------------------------------------------------------------------
  // Build the scene
  // ---------------------------------------------------------------------
  var root = new THREE.Group();
  scene.add(root);

  var SEGMENTS = 9; // verlet points per rope (index 0..SEGMENTS)
  var CURVE_SAMPLES = 28;

  function makeRope(anchorPos, colorHex, ticks, holes, width) {
    var points = [];
    var prevPoints = [];
    for (var i = 0; i <= SEGMENTS; i++) {
      var t = i / SEGMENTS;
      var p = anchorPos.clone().lerp(new THREE.Vector3(anchorPos.x * 0.3, -1, 0.4), t);
      points.push(p);
      prevPoints.push(p.clone());
    }
    var segLen = 0.62; // rest length per segment (slightly slack for natural sag)

    var curve = new THREE.CatmullRomCurve3(points.slice(), false, 'chordal');
    var ribbonGeo = makeRibbonGeometry(CURVE_SAMPLES);
    var tex = strapTexture(colorHex, ticks, holes);
    var mat = new THREE.MeshPhysicalMaterial({ map: tex, color: 0xffffff, roughness: 0.75, metalness: 0.0, clearcoat: 0.15, clearcoatRoughness: 0.6, side: THREE.DoubleSide, envMapIntensity: 0.5 });
    var mesh = new THREE.Mesh(ribbonGeo, mat);
    root.add(mesh);

    return {
      points: points,
      prev: prevPoints,
      anchor: anchorPos.clone(),
      segLen: segLen,
      curve: curve,
      mesh: mesh,
      width: width
    };
  }

  var leftAnchor = new THREE.Vector3(-0.78, 6.4, -0.55);
  var rightAnchor = new THREE.Vector3(0.78, 6.4, -0.55);
  var ropeLeft = makeRope(leftAnchor, '#B7BBC2', true, false, 0.155);
  var ropeRight = makeRope(rightAnchor, '#17181A', true, true, 0.155);

  // card group
  var cardGroup = new THREE.Group();
  root.add(cardGroup);

  var frontImage = new Image();
  var cardBuilt = false;

  var grommet = buildGrommet();
  var dRingLeft = buildDRing();
  var dRingRight = buildDRing();
  dRingLeft.position.set(-0.052, HOLE_Y - 0.01, 0.008);
  dRingRight.position.set(0.052, HOLE_Y - 0.01, 0.008);
  var carabinerLeft = buildCarabiner();
  var carabinerRight = buildCarabiner();
  carabinerLeft.position.set(-0.052, HOLE_Y + 0.12, 0.01);
  carabinerRight.position.set(0.052, HOLE_Y + 0.12, 0.01);
  carabinerLeft.rotation.z = 0.08;
  carabinerRight.rotation.z = -0.08;

  cardGroup.add(grommet, dRingLeft, dRingRight, carabinerLeft, carabinerRight);

  var buckleLeft = buildBuckle();
  var buckleRight = buildBuckle();
  root.add(buckleLeft, buckleRight);

  function onPhotoLoaded() {
    var tex = makeCardTexture(frontImage);
    var cardMesh = buildCardMesh(tex);
    cardGroup.add(cardMesh);
    cardBuilt = true;
    loadingEl.classList.add('hidden');
    hintEl.classList.add('show');
    setTimeout(function () { hintEl.classList.remove('show'); }, 4200);
  }

  // ---------------------------------------------------------------------
  // Physics state
  // ---------------------------------------------------------------------
  var GRAVITY = new THREE.Vector3(0, -9.0, 0);
  var clock = new THREE.Clock();

  var cardYaw = 0.08, cardYawVel = 0;
  var cardRoll = 0, cardRollVel = 0;
  var cardPitch = 0, cardPitchVel = 0;
  var cardCenter = new THREE.Vector3(0, -0.55, 0.3);
  var cardVel = new THREE.Vector3();

  var dragging = false;
  var dragOffset = new THREE.Vector3();
  var raycaster = new THREE.Raycaster();
  var pointerNDC = new THREE.Vector2();
  var dragPlane = new THREE.Plane();
  var lastPointerWorld = new THREE.Vector3();
  var pointerVel = new THREE.Vector3();

  var timeAcc = 0;
  var FIXED_DT = 1 / 60;

  function verletStep(rope, dt, attachTargetLocal) {
    var pts = rope.points, prev = rope.prev;
    // integrate free points (1..SEGMENTS-1); point 0 fixed to anchor; last point driven to attach target
    for (var i = 1; i < SEGMENTS; i++) {
      var cur = pts[i];
      var before = prev[i];
      var vx = (cur.x - before.x) * 0.985;
      var vy = (cur.y - before.y) * 0.985;
      var vz = (cur.z - before.z) * 0.985;
      var nx = cur.x + vx + GRAVITY.x * dt * dt;
      var ny = cur.y + vy + GRAVITY.y * dt * dt;
      var nz = cur.z + vz + GRAVITY.z * dt * dt;
      before.copy(cur);
      cur.set(nx, ny, nz);
    }
    pts[0].copy(rope.anchor);
    pts[SEGMENTS].copy(attachTargetLocal);
    prev[SEGMENTS].copy(attachTargetLocal);

    // distance constraints (a few relaxation iterations)
    for (var iter = 0; iter < 6; iter++) {
      for (var s = 0; s < SEGMENTS; s++) {
        var p1 = pts[s], p2 = pts[s + 1];
        var dx = p2.x - p1.x, dy = p2.y - p1.y, dz = p2.z - p1.z;
        var dist = Math.sqrt(dx * dx + dy * dy + dz * dz) || 0.0001;
        var diff = (dist - rope.segLen) / dist;
        var isP1Fixed = (s === 0);
        var isP2Fixed = (s + 1 === SEGMENTS);
        var w1 = isP1Fixed ? 0 : (isP2Fixed ? 1 : 0.5);
        var w2 = isP2Fixed ? 0 : (isP1Fixed ? 1 : 0.5);
        p1.x += dx * diff * w1; p1.y += dy * diff * w1; p1.z += dz * diff * w1;
        p2.x -= dx * diff * w2; p2.y -= dy * diff * w2; p2.z -= dz * diff * w2;
      }
      pts[0].copy(rope.anchor);
      pts[SEGMENTS].copy(attachTargetLocal);
    }
  }

  var attachLeftWorld = new THREE.Vector3();
  var attachRightWorld = new THREE.Vector3();
  var localAttachLeft = new THREE.Vector3(-0.052, HOLE_Y + 0.14, 0.01);
  var localAttachRight = new THREE.Vector3(0.052, HOLE_Y + 0.14, 0.01);

  function updatePhysics(dt) {
    // --- rope simulation, driven toward current card attach points ---
    attachLeftWorld.copy(localAttachLeft).applyMatrix4(cardGroup.matrixWorld);
    attachRightWorld.copy(localAttachRight).applyMatrix4(cardGroup.matrixWorld);
    verletStep(ropeLeft, dt, attachLeftWorld);
    verletStep(ropeRight, dt, attachRightWorld);

    // --- derive suspension point M from the ropes' pre-last points ---
    var mLeft = ropeLeft.points[SEGMENTS - 1];
    var mRight = ropeRight.points[SEGMENTS - 1];
    var M = new THREE.Vector3().addVectors(mLeft, mRight).multiplyScalar(0.5);

    if (!dragging) {
      // spring the card's hang-point toward M (soft link so it doesn't snap instantly)
      var targetCenter = new THREE.Vector3(
        M.x, M.y - (CARD_HH - HOLE_Y + 0.02), (M.z + 0.28)
      );
      cardVel.addScaledVector(targetCenter.clone().sub(cardCenter), 18 * dt);
      cardVel.multiplyScalar(Math.pow(0.001, dt));
      cardCenter.addScaledVector(cardVel, dt);

      var idle = Math.sin(clock.elapsedTime * 0.6) * 0.02;
      cardCenter.x += idle * dt * 0.4;

      var yawTarget = THREE.MathUtils.clamp(-cardVel.x * 0.55, -0.5, 0.5);
      cardYawVel += (yawTarget - cardYaw) * 10 * dt;
      cardYawVel *= Math.pow(0.06, dt);
      cardYaw += cardYawVel * dt;

      var rollTarget = THREE.MathUtils.clamp(-cardVel.x * 0.18, -0.22, 0.22);
      cardRollVel += (rollTarget - cardRoll) * 9 * dt;
      cardRollVel *= Math.pow(0.05, dt);
      cardRoll += cardRollVel * dt;

      var pitchTarget = THREE.MathUtils.clamp(cardVel.y * 0.12, -0.15, 0.15);
      cardPitchVel += (pitchTarget - cardPitch) * 8 * dt;
      cardPitchVel *= Math.pow(0.05, dt);
      cardPitch += cardPitchVel * dt;
    }

    cardGroup.position.copy(cardCenter);
    cardGroup.rotation.set(cardPitch, cardYaw, cardRoll);
    cardGroup.updateMatrixWorld(true);

    // ribbons
    ropeLeft.curve.points = ropeLeft.points;
    ropeRight.curve.points = ropeRight.points;
    var curveL = ropeLeft.curve.getPoints(CURVE_SAMPLES);
    var curveR = ropeRight.curve.getPoints(CURVE_SAMPLES);
    updateRibbon(ropeLeft.mesh.geometry, curveL, ropeLeft.width, camera);
    updateRibbon(ropeRight.mesh.geometry, curveR, ropeRight.width, camera);

    // buckles sit near the top of each strap
    var bL = ropeLeft.points[1], bL2 = ropeLeft.points[2];
    var bR = ropeRight.points[1], bR2 = ropeRight.points[2];
    buckleLeft.position.copy(bL).lerp(bL2, 0.4);
    buckleRight.position.copy(bR).lerp(bR2, 0.4);
    buckleLeft.lookAt(ropeLeft.anchor);
    buckleRight.lookAt(ropeRight.anchor);
  }

  // ---------------------------------------------------------------------
  // Pointer interaction (drag the card)
  // ---------------------------------------------------------------------
  function setPointerFromEvent(e) {
    var x = (e.touches ? e.touches[0].clientX : e.clientX);
    var y = (e.touches ? e.touches[0].clientY : e.clientY);
    pointerNDC.x = (x / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(y / window.innerHeight) * 2 + 1;
  }

  function pointerWorldOnPlane(z) {
    raycaster.setFromCamera(pointerNDC, camera);
    dragPlane.set(new THREE.Vector3(0, 0, 1), -z);
    var out = new THREE.Vector3();
    raycaster.ray.intersectPlane(dragPlane, out);
    return out || new THREE.Vector3();
  }

  function onDown(e) {
    if (!cardBuilt) return;
    setPointerFromEvent(e);
    raycaster.setFromCamera(pointerNDC, camera);
    var hits = raycaster.intersectObject(cardGroup, true);
    if (hits.length === 0) return;
    dragging = true;
    canvas.style.cursor = 'grabbing';
    var worldPt = pointerWorldOnPlane(cardCenter.z);
    dragOffset.copy(cardCenter).sub(worldPt);
    lastPointerWorld.copy(worldPt);
    hintEl.classList.remove('show');
    e.preventDefault && e.preventDefault();
  }

  function onMove(e) {
    setPointerFromEvent(e);
    if (!dragging) return;
    var worldPt = pointerWorldOnPlane(cardCenter.z);
    pointerVel.copy(worldPt).sub(lastPointerWorld);
    lastPointerWorld.copy(worldPt);
    cardCenter.copy(worldPt).add(dragOffset);
    e.preventDefault && e.preventDefault();
  }

  function onUp(e) {
    if (!dragging) return;
    dragging = false;
    canvas.style.cursor = 'grab';
    cardVel.copy(pointerVel).multiplyScalar(1 / FIXED_DT).clampLength(0, 6);
    cardYawVel += -cardVel.x * 0.5;
  }

  canvas.addEventListener('pointerdown', onDown);
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  canvas.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);

  // subtle camera parallax on mouse move (when not dragging)
  var parallax = new THREE.Vector2();
  window.addEventListener('pointermove', function (e) {
    parallax.x = (e.clientX / window.innerWidth) * 2 - 1;
    parallax.y = (e.clientY / window.innerHeight) * 2 - 1;
  });

  // ---------------------------------------------------------------------
  // Main loop
  // ---------------------------------------------------------------------
  function animate() {
    requestAnimationFrame(animate);
    var dt = Math.min(clock.getDelta(), 1 / 30);
    timeAcc += dt;
    while (timeAcc >= FIXED_DT) {
      updatePhysics(FIXED_DT);
      timeAcc -= FIXED_DT;
    }
    camera.position.x += (parallax.x * 0.55 - camera.position.x) * 0.04;
    camera.position.y += (0.4 - parallax.y * 0.35 - camera.position.y) * 0.04;
    camera.lookAt(0, -0.2, 0);
    renderer.render(scene, camera);
  }

  resize();
  frontImage.crossOrigin = 'anonymous';
  frontImage.onload = onPhotoLoaded;
  frontImage.src = window.__BADGE_PHOTO_DATAURI__;

  // font warm-up so canvas text uses the right typeface, then (re)draw if needed
  if (document.fonts && document.fonts.ready) {
    document.fonts.load('900 208px "Archivo Black"');
    document.fonts.load('600 40px "Space Grotesk"');
  }

  animate();
})();
  </script>
</body>
</html>
