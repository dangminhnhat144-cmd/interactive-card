<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Lanyard Badge</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    #canvas-container {
      width: 100vw; height: 100vh;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(18, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 20);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    // Ánh sáng Studio
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    // Thẻ PVC
    const textureLoader = new THREE.TextureLoader();
    const frontTexture = textureLoader.load('https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=600&q=80');

    const cardGeometry = new THREE.PlaneGeometry(2.2, 3.2);
    const cardMaterial = new THREE.MeshPhysicalMaterial({
      map: frontTexture,
      roughness: 0.15,
      metalness: 0.1,
      clearcoat: 1.0,
      clearcoatRoughness: 0.05,
      side: THREE.DoubleSide
    });
    const card = new THREE.Mesh(cardGeometry, cardMaterial);
    card.position.set(0, -1, 0);
    scene.add(card);

    // Dây Lanyard (Vật lý Verlet Rope)
    const segmentCount = 12;
    const ropeNodes = [];
    for (let i = 0; i <= segmentCount; i++) {
      ropeNodes.push({
        pos: new THREE.Vector3(0, 4 - (i * 0.35), 0),
        oldPos: new THREE.Vector3(0, 4 - (i * 0.35), 0)
      });
    }

    const ropeCurve = new THREE.CatmullRomCurve3(ropeNodes.map(n => n.pos));
    const ropeGeo = new THREE.TubeGeometry(ropeCurve, 32, 0.05, 8, false);
    const ropeMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.5 });
    const ropeMesh = new THREE.Mesh(ropeGeo, ropeMat);
    scene.add(ropeMesh);

    // Tương tác kéo thả
    let isDragging = false;
    let dragPos = new THREE.Vector3();

    window.addEventListener('pointerdown', () => { isDragging = true; });
    window.addEventListener('pointerup', () => { isDragging = false; });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1,
        0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const distance = -camera.position.z / dir.z;
      dragPos.copy(camera.position).add(dir.multiplyScalar(distance));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Vòng lặp vật lý
    function animate() {
      requestAnimationFrame(animate);

      // Điểm gốc cố định trên đỉnh
      ropeNodes[0].pos.set(0, 4, 0);

      // Vị trí đuôi dây kéo thẻ
      if (isDragging) {
        ropeNodes[segmentCount].pos.lerp(dragPos, 0.3);
      } else {
        // Đung đưa nhẹ
        const t = Date.now() * 0.002;
        ropeNodes[segmentCount].pos.x = Math.sin(t) * 0.5;
      }

      // Cập nhật vị trí thẻ theo điểm cuối của dây
      card.position.copy(ropeNodes[segmentCount].pos).sub(new THREE.Vector3(0, 1.6, 0));
      card.rotation.y = (ropeNodes[segmentCount].pos.x) * 0.3;

      // Cập nhật hình dáng dây
      ropeMesh.geometry.dispose();
      ropeCurve.points = ropeNodes.map(n => n.pos);
      ropeMesh.geometry = new THREE.TubeGeometry(ropeCurve, 32, 0.05, 8, false);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
