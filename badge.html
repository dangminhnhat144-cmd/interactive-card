<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive 3D Lanyard Badge</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: transparent !important;
    }
    #canvas-container {
      width: 100vw; height: 100vh;
      cursor: grab;
    }
    #canvas-container:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();

    // Camera lùi xa (z = 19) để không bị cắt khung hình khi đung đưa
    const camera = new THREE.PerspectiveCamera(18, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 19);

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000, 0); // Nền trong suốt
    container.appendChild(renderer.domElement);

    // Hệ thống Ánh sáng Studio phản quang
    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 3);
    dirLight1.position.set(5, 10, 7);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xe8f0ff, 2);
    dirLight2.position.set(-5, -5, 5);
    scene.add(dirLight2);

    // Load Ảnh chân dung của bạn
    const textureLoader = new THREE.TextureLoader();
    // Đổi 'avatar.jpg' thành tên file ảnh thực tế trên GitHub của bạn nếu khác tên
    const userTexture = textureLoader.load('./avatar.jpg', (tex) => {
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.flipY = false;
    });

    const badgeGroup = new THREE.Group();
    scene.add(badgeGroup);

    // Load Model 3D (card.glb) gồm Thẻ, Kẹp nhựa & Móc kim loại
    const loader = new GLTFLoader();
    loader.load('./card.glb', (gltf) => {
      const model = gltf.scene;
      model.scale.setScalar(2.25);
      model.position.set(0, -1.2, -0.05);

      model.traverse((child) => {
        if (child.isMesh) {
          if (child.name.includes('card') || child.geometry) {
            // Ép chất liệu nhựa PVC bóng bẩy cao cấp + dán ảnh chân dung
            child.material = new THREE.MeshPhysicalMaterial({
              map: userTexture,
              roughness: 0.15,
              metalness: 0.1,
              clearcoat: 1.0,
              clearcoatRoughness: 0.05
            });
          }
          if (child.name.includes('clip') || child.name.includes('clamp')) {
            // Chất liệu kim loại cho móc kẹp
            child.material = new THREE.MeshStandardMaterial({
              color: 0xaaaaaa,
              metalness: 0.9,
              roughness: 0.2
            });
          }
        }
      });

      badgeGroup.add(model);
    }, undefined, (err) => {
      console.error("Vui lòng đảm bảo file card.glb đã được tải lên cùng thư mục!");
    });

    // Tạo dây Lanyard (Rope)
    const curvePoints = [
      new THREE.Vector3(0, 4, 0),
      new THREE.Vector3(0, 2, 0),
      new THREE.Vector3(0, 0.5, 0),
      new THREE.Vector3(0, 0, 0)
    ];
    const curve = new THREE.CatmullRomCurve3(curvePoints);
    const tubeGeo = new THREE.TubeGeometry(curve, 32, 0.06, 8, false);
    
    const lanyardTex = textureLoader.load('./lanyard.png');
    lanyardTex.wrapS = lanyardTex.wrapT = THREE.RepeatWrapping;
    lanyardTex.repeat.set(1, 10);

    const tubeMat = new THREE.MeshStandardMaterial({
      map: lanyardTex,
      color: 0xffffff,
      roughness: 0.4
    });
    const lanyardMesh = new THREE.Mesh(tubeGeo, tubeMat);
    scene.add(lanyardMesh);

    // Tương tác Kéo / Thả / Đung đưa
    let isDragging = false;
    let dragTarget = new THREE.Vector3();
    let currentPos = new THREE.Vector3(0, 0, 0);

    window.addEventListener('pointerdown', () => { isDragging = true; });
    window.addEventListener('pointerup', () => { isDragging = false; });
    window.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1,
        0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      dragTarget.copy(camera.position).add(dir.multiplyScalar(dist));
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      if (isDragging) {
        currentPos.lerp(dragTarget, 0.2);
      } else {
        // Tự động lắc lư tự nhiên khi thả chuột
        const swingX = Math.sin(time * 2) * 0.4;
        const swingY = Math.cos(time * 1.5) * 0.1;
        currentPos.lerp(new THREE.Vector3(swingX, swingY, 0), 0.05);
      }

      badgeGroup.position.copy(currentPos);
      badgeGroup.rotation.y = currentPos.x * 0.3;
      badgeGroup.rotation.z = -currentPos.x * 0.1;

      // Cập nhật dây đung đưa biến dạng theo thẻ
      curvePoints[3].copy(currentPos);
      curvePoints[2].set(currentPos.x * 0.7, 1.5, 0);
      curvePoints[1].set(currentPos.x * 0.3, 2.8, 0);

      lanyardMesh.geometry.dispose();
      lanyardMesh.geometry = new THREE.TubeGeometry(new THREE.CatmullRomCurve3(curvePoints), 32, 0.06, 8, false);

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
